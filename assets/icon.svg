  <rect x="580" y="370" width="30" height="90" fill="white"/>
  <rect x="630" y="320" width="30" height="140" fill="white"/>
  
  <!-- Dollar sign -->
  <text x="512" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">$</text>
  
  <!-- Optimization arrows -->
  <path d="M150 200 L200 150 L250 200" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M774 200 L824 150 L874 200" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Headlights -->
